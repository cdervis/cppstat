    support:
      - GCC 13
      - Clang 15
      - Xcode 16.1
  - desc: "[Empty initializers](https://cppreference.com/c/language/initialization#Empty_initialization)"
    paper: N2900
    content: c-empty-init.md
    support:
      - tool: GCC 13
        note: "Partially supported as an extension before."
      - tool: Clang 17
        note: "Supported as an extension before without support for scalars and variable-length arrays (VLAs)."
      - tool: Xcode
        status: partial
        note: "Supported as an extension. Missing support for scalars and variable-length arrays (VLAs)."
      - R++
  - desc: "`typeof` and `typeof_unqual`"
    paper:
      - N2927
      - N2930
    content: c-typeof.md
    support:
      - tool: GCC 13
        note: "Prior to GCC 13: Supported as an extension. Only typeof (and `__typeof__` in strict modes) supported."
      - tool: Clang 16
        note: "Prior to Clang 16: Supported as an extension. Only typeof (and `__typeof__` in strict modes) supported."
      - MSVC 14.39
      - tool: Xcode
        status: partial
        note: "Supported as an extension. Only typeof (and `__typeof__` in strict modes) supported."
      - R++ 2024.3
  - desc: "New spelling of keywords"
