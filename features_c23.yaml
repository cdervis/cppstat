      - tool: Clang 6
        status: partial
        note: "Only `_Float16` is supported."
      - tool: Xcode
        status: partial
        note: "Only `_Float16` is supported."
  - desc: "Compatibility of Pointers to Arrays with Qualifiers"
    paper: N2607
