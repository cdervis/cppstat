---
features:
  - desc: "UB? In My Lexer? (Remove undefined behavior from lexing)"
    paper: P2621
    support:
      - GCC
      - Clang 3.3
      - Xcode 16

  - desc: "Making non-encodable string literals ill-formed"
    paper: P1854
    support:
      - GCC 14
      - Clang 14
      - Xcode 16

  - desc: "[Unevaluated strings](https://cppreference.com/cpp/language/string_literal#Unevaluated_strings)"
    paper: P2361
    support:
      - GCC 14
      - tool: Clang 17
        status: partial
        note: "Attributes arguments don't yet parse as unevaluated string literals."
      - Clang 18
      - Xcode 16

  - desc: "Add `@`, `$`, and `` ` `` to the [basic character set](https://cppreference.com/cpp/language/charset#Basic_character_set)"
    paper: P2558
    support:
      - GCC 15
      - Clang
      - Xcode 15

  - desc: "`constexpr` cast from `void*`: towards `constexpr` type-erasure"
    paper: P2738
    summary: "Recover a typed pointer from `void*` during constant evaluation."
    support:
      - GCC 14
      - Clang 17
      - Xcode 16.3
      - R++
    ftm:
      - name: __cpp_constexpr
        value: 202306L

  - desc: "On the ignorability of standard attributes"
    paper: P2552
    support:
      - GCC 15
      - Clang
      - Xcode 16.3

  - desc: "Static storage for braced initializers"
    paper: P2752
    support: [GCC 14, R++]

  - desc: "User-generated `static_assert` messages"
    paper: P2741
    summary: "`static_assert` can now use user-generated strings, not just string literals."
    support:
      - GCC 14
      - Clang 17
      - Xcode 16.3
      - tool: R++
        status: unsupported
        issue: RSCPP-35928
    ftm:
      - name: __cpp_static_assert
        value: 202306L

  - desc: "A nice placeholder with no name (using `_` as a variable name)"
    paper: P2169
    summary: "The underscore `_` can now be used as a placeholder variable name that doesn't actually bind a name."
    support:
      - GCC 14
      - Clang 18
      - Xcode 16.3
      - R++ 2025.2
    ftm:
      - name: __cpp_placeholder_variables
        value: 202306L

  - desc: "Testing for success or failure of `<charconv>` functions"
